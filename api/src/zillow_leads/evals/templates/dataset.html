<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zillow reply dataset</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --ink:#1f1e1c; --muted:#6b6a65; --line:#dcdad2; --tint:#f0eee7;
          --train:#6d4fc4; --dev:#0f7d6c; --now:#b06a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#191918; --card:#232321; --ink:#ecebe6; --muted:#a3a29b; --line:#3a3936; --tint:#2c2b29;
            --train:#b3a0f0; --dev:#5fcdb9; --now:#e3b55a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:22px; margin:0 0 6px; font-weight:600; }
  p { margin:0 0 10px; }
  .muted { color:var(--muted); }
  .splits { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin:16px 0; }
  @media (max-width: 700px) { .splits { grid-template-columns:1fr; } }
  .split { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .split h2 { font-size:15px; margin:0; font-weight:600; }
  .split .count { font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; }
  .split.train h2 { color:var(--train); } .split.dev h2 { color:var(--dev); }
  .split.sealed { border-style:dashed; }
  .next { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:16px; }
  .next a { font-weight:600; }
  a { color:inherit; }
  .bar { position:sticky; top:0; z-index:1; background:var(--bg); padding:10px 0; border-bottom:1px solid var(--line);
         display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  select, input[type=search] { font:inherit; padding:6px 10px; border-radius:6px; border:1px solid var(--line);
         background:var(--card); color:var(--ink); }
  input[type=search] { flex:1; min-width:180px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:12px; padding:12px 14px; }
  .meta { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-bottom:8px; }
  .badge { font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--tint); color:var(--ink); }
  .badge.train { color:var(--train); } .badge.dev { color:var(--dev); } .badge.run { color:var(--now); text-decoration:none; }
  .id { font:12px ui-monospace, monospace; }
  .text { white-space:pre-wrap; overflow-wrap:anywhere; margin:0; font:inherit; }
  details { margin-top:8px; }
  summary { cursor:pointer; color:var(--muted); font-size:13px; }
  details .text { background:var(--tint); padding:10px; border-radius:6px; margin-top:6px; font-size:13px; }
  .who { font-weight:600; font-size:12px; margin:8px 0 2px; }
  .empty { text-align:center; color:var(--muted); padding:30px 0; }
</style>
</head>
<body>
<main>
  <h1>The dataset</h1>
  <p class="muted" id="intro"></p>
  <div class="splits" id="splits"></div>
  <div class="next" id="next"></div>
  <div class="bar">
    <select id="split" aria-label="Split">
      <option value="all">Train and dev</option>
      <option value="dev">Dev only</option>
      <option value="train">Train only</option>
    </select>
    <select id="kind" aria-label="Kind of test case">
      <option value="all">First messages and follow-ups</option>
      <option value="first">First message from a lead</option>
      <option value="followup">Follow-ups</option>
    </select>
    <select id="run" aria-label="Experiment"></select>
    <input type="search" id="search" placeholder="Search what leads wrote" aria-label="Search what leads wrote">
    <span class="muted" id="count"></span>
  </div>
  <div id="cases"></div>
  <p class="empty" id="empty" hidden>No test cases match these filters.</p>
</main>
<script type="application/json" id="data">__DATASET_DATA__</script>
<script>
// Opened as it sits in the repository, this file is a template with no data.
const RAW = document.getElementById('data').textContent;
if (RAW.startsWith('__')) {
  document.body.innerHTML = '<p style="max-width:40rem;margin:3rem auto;padding:0 1rem;font:16px/1.5 system-ui">' +
    'This is the page template, so it has no data to show. The page with data is ' +
    '<code>evals/data/dataset.html</code>, or <a href="http://localhost:8377/dataset.html">localhost:8377/dataset.html</a> ' +
    'while <code>evals serve</code> is running.</p>';
  throw new Error('This file is the template. Open evals/data/dataset.html instead.');
}
const DATA = JSON.parse(RAW);

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

const total = DATA.totals.train.cases + DATA.totals.dev.cases + DATA.totals.test.cases;
const threads = DATA.totals.train.threads + DATA.totals.dev.threads + DATA.totals.test.threads;
document.getElementById('intro').textContent =
  total + ' test cases from ' + threads + ' email threads. Each one is a moment where a lead had written and a response was owed. ' +
  'Only the conversation is stored here; listings and tour times are added when an experiment runs.';

const SPLIT_TEXT = {
  train: ['Train split', 'Readable. Cases here may be turned into few-shot examples inside a prompt.'],
  dev: ['Dev split', 'Readable. Experiments, annotation and changes all happen on these.'],
  test: ['Test split', 'Sealed. Nothing from these threads is on this page, so nothing can be tuned against them.'],
};
const splitsBox = document.getElementById('splits');
for (const name of ['train', 'dev', 'test']) {
  const box = el('div', 'split ' + (name === 'test' ? 'sealed' : name));
  box.append(
    el('h2', '', SPLIT_TEXT[name][0]),
    el('div', 'count', String(DATA.totals[name].cases)),
    el('div', 'muted', 'from ' + DATA.totals[name].threads + (DATA.totals[name].threads === 1 ? ' thread' : ' threads')),
    el('p', 'muted', SPLIT_TEXT[name][1]),
  );
  splitsBox.append(box);
}

const next = document.getElementById('next');
if (DATA.reviews.length === 0) {
  next.append(el('span', 'muted', 'No experiment has been run on these cases yet.'));
} else {
  next.append(el('span', '', 'Experiments to review: '));
  DATA.reviews.forEach((review, index) => {
    const link = el('a', '', review.run + ' (' + review.count + ' decisions)');
    link.href = review.href;
    next.append(link, document.createTextNode(index < DATA.reviews.length - 1 ? ', ' : ''));
  });
}

const runSelect = document.getElementById('run');
runSelect.append(new Option('Any experiment status', 'all'), new Option('Not in any experiment', 'none'));
for (const review of DATA.reviews) runSelect.append(new Option('In ' + review.run, review.run));

const list = document.getElementById('cases');
const cards = DATA.cases.map(c => {
  const card = el('section', 'card');
  const meta = el('div', 'meta');
  meta.append(
    el('span', 'badge ' + c.split, c.split === 'train' ? 'Train' : 'Dev'),
    el('span', '', c.first ? 'First message' : 'Follow-up'),
    el('span', '', c.when),
    el('span', '', c.messages + (c.messages === 1 ? ' message so far' : ' messages so far')),
  );
  for (const run of c.runs) {
    const link = el('a', 'badge run', run.run + ': ' + run.action.replace('_', ' '));
    link.href = run.href;
    meta.append(link);
  }
  meta.append(el('span', 'id', c.id));
  card.append(meta, el('pre', 'text', c.lead_message));

  if (c.earlier.length) {
    const d = el('details');
    d.append(el('summary', '', 'Earlier in this thread (' + c.earlier.length + ')'));
    const body = el('div', 'text');
    for (const m of c.earlier) body.append(el('div', 'who', m.who + ', ' + m.when), el('div', '', m.body));
    d.append(body);
    card.append(d);
  }
  const sent = el('details');
  sent.append(
    el('summary', '', c.actual_reply ? 'What we actually sent (' + c.actual_delay + ' min later)' : 'We never answered this one'),
    el('pre', 'text', c.actual_reply || '(nothing sent)'),
  );
  card.append(sent);
  list.append(card);
  return { c, card, haystack: (c.lead_message + ' ' + c.id).toLowerCase() };
});

function refresh() {
  const split = document.getElementById('split').value;
  const kind = document.getElementById('kind').value;
  const run = runSelect.value;
  const query = document.getElementById('search').value.trim().toLowerCase();
  let shown = 0;
  for (const { c, card, haystack } of cards) {
    const ok =
      (split === 'all' || c.split === split) &&
      (kind === 'all' || (kind === 'first') === c.first) &&
      (run === 'all' || (run === 'none' ? c.runs.length === 0 : c.runs.some(r => r.run === run))) &&
      (!query || haystack.includes(query));
    card.hidden = !ok;
    if (ok) shown += 1;
  }
  document.getElementById('count').textContent = 'Showing ' + shown + ' of ' + cards.length;
  document.getElementById('empty').hidden = shown > 0;
}
for (const id of ['split', 'kind', 'run']) document.getElementById(id).addEventListener('change', refresh);
document.getElementById('search').addEventListener('input', refresh);
refresh();
</script>
</body>
</html>
