packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@clerk/shared': true
  browser-tabs-lock: true
  bufferutil: true
  core-js: true
  esbuild: true
  msw: true
  unrs-resolver: true
  utf-8-validate: true

overrides:
