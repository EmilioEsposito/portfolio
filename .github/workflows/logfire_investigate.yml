name: logfire-investigate

on:
  schedule:
    # Runs twice per day. Times are UTC; ET equivalents assume EDT (UTC-4)
    # and will shift by an hour during EST — that's acceptable.
    - cron: "0 13 * * *"   # ~09:00 ET
    - cron: "30 22 * * *"  # ~18:30 ET (6:30pm)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and print the payload but do NOT fire the routine"
        type: boolean
        default: false

# Serialize runs so a manual run and the cron run never overlap.
concurrency:
  group: logfire-investigate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Logfire investigate
        id: run
        run: python .github/logfire-investigate/investigate.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          LOGFIRE_BASE: ${{ vars.LOGFIRE_BASE }}
          LOGFIRE_GHA_TOKEN: ${{ secrets.LOGFIRE_GHA_TOKEN }}
          CC_ROUTINE_TOKEN: ${{ secrets.CC_ROUTINE_TOKEN }}
          CC_ROUTINE_ID: ${{ secrets.CC_ROUTINE_ID }}

      - name: Show Claude session link
        if: steps.run.outputs.fired == '1'
        run: |
          echo "Claude Code session: ${{ steps.run.outputs.session_url }}"
          echo "Session id:          ${{ steps.run.outputs.session_id }}"

      # The audit trail lives with the run: the fire record goes to the job
      # summary (write_summary in investigate.py) and history.log is uploaded
      # as an artifact. Nothing is committed back to the repo.
      - name: Upload history.log audit entry
        if: steps.run.outputs.fired == '1'
        uses: actions/upload-artifact@v4
        with:
          name: history-log
          path: .github/logfire-investigate/history.log
